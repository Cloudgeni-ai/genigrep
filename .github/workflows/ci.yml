name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20"]
        include:
          - os: ubuntu-latest
            node: "22"
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: CLI smoke test under Node
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          # No API key in CI: doctor must find ripgrep and then exit 3 (setup problem).
          set +e
          node dist/cli.js doctor
          code=$?
          set -e
          test "$code" -eq 3

      - name: Package contents
        run: npm pack --dry-run
